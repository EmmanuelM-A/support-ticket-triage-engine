name: Unit tests

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.13"

jobs:
  unit:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - name: Unit tests
        run: uv run pytest tests/unit
