name: Type check

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.13"

jobs:
  typecheck:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - name: Mypy
        run: uv run mypy src tests
